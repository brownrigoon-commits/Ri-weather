  <link rel="stylesheet" href="css/style.css">
  <script>
    // 주소 끝에 ?reset 을 붙여 열면 캐시·서비스워커를 지우고 최신으로 다시 엽니다.
    // (폰에 옛 버전이 남아 화면이 갱신되지 않을 때의 탈출구)
    // ⚠️ 관심종목·내 전략 같은 사용자 기록은 지우지 않습니다. ?reset=hard 만 전부 지웁니다.
    (function () {
      var m = /[?&]reset(?:=(\w+))?/.exec(location.search);
      if (!m) return;
      var 마무리 = function () { location.replace(location.pathname + '?fresh=' + Date.now()); };
      var 작업 = [];
      try {
        if ('serviceWorker' in navigator) {
          작업.push(navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        }
        if (window.caches) {
          작업.push(caches.keys()
            .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        }
        if (m[1] === 'hard') { try { localStorage.clear(); } catch (e) {} }
      } catch (e) {}
      Promise.all(작업).then(마무리, 마무리);
      setTimeout(마무리, 2500);
    })();
  </script>

<body>

  <!-- 화면 4개 — 내용은 js/app.js 가 채웁니다 -->
  <main id="app">
    <section class="view" id="view-brief" aria-label="오늘 브리핑">

    </section>
    <section class="view" id="view-strategy" aria-label="전략" hidden></section>
    <section class="view" id="view-stocks" aria-label="종목" hidden></section>
    <section class="view" id="view-my" aria-label="내 전략" hidden></section>
  </main>

  <!-- 종목 상세 시트 -->

  <div class="toast" id="toast" hidden></div>

  <!-- 하단 고정: 투자권유 아님 고지 + 탭바 (모든 화면에서 항상 보입니다) -->

    </p>

      <button type="button" data-act="탭" data-tab="my"      ><span class="ti">⚙️</span>내 전략</button>
    </nav>
  </footer>

  <!-- 전략 계산의 정본. app.js 는 여기 있는 규칙을 다시 구현하지 않고 호출만 합니다. -->
  <script src="js/strategy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* 오프라인 캐시 없이도 동작 */ });
      });
    }
  </script>
