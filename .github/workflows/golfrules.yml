# =====================================================================
#  골프 규칙 월간 점검
#
#  앱의 '골프 정신 → 세계 골프 룰' 코너는 R&A·USGA 2023년판 기준입니다.
#  분기마다 Clarifications(유권해석)가 나오고 4년마다 본문이 개정되는데,
#  그걸 놓치면 앱이 **옛 규칙을 자신 있게** 말하게 됩니다. 그게 최악입니다.
#  그래서 매달 한 번 공식 페이지를 확인합니다. 설계는 docs/골프정신_설계.md 7장.
#
#  ⚠ cron 은 **기본 브랜치(main)에 있는 워크플로만** 동작합니다.
#     main 에 들어가는 순간부터 시작되고, 그전에는 Actions 탭의
#     "Run workflow"(수동 실행)로만 돌릴 수 있습니다. (ristock-daily.yml 과 같은 함정)
#
#  ⚠ 이 파일은 `release_courses.py` 의 stage() 목록에 `.github` 가 없어서
#     배포 스크립트로는 커밋되지 않습니다. `git add .github` 로 직접 커밋해야 합니다.
#
#  결과:
#    · 바뀐 것 없음 → 스냅샷의 lastChecked 만 갱신해 커밋 (앱 화면의 '최근 점검' 근거)
#    · 변경 감지    → docs/골프룰_점검리포트.md 를 커밋하고 **실패로 종료**
#                     (GitHub 이 실패를 메일로 알려 줍니다 — 침묵은 성공이 아닙니다)
# =====================================================================
name: 골프 규칙 월간 점검

on:
  schedule:
    # cron 은 UTC 기준입니다. 한국시간(KST) = UTC + 9시간.
    #   0 0 2 * *  →  00:00 UTC = **매월 2일 09:00 KST**
    # (1일이 아니라 2일인 이유: Clarifications 는 1·4·7·10월 1일자로 올라오므로
    #  하루 여유를 두면 그날 갱신분까지 잡힙니다)
    - cron: '0 0 2 * *'

  # 손으로 즉시 돌리기: Actions 탭 → 이 워크플로 → Run workflow
  workflow_dispatch:

permissions:
  contents: write        # 스냅샷·리포트를 커밋하려면 필요합니다

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 점검 자체가 실패해도 일단 커밋은 남기고, 마지막에 결과대로 종료합니다.
      # (변경을 감지한 리포트가 커밋되지 않고 사라지면 아무 소용이 없습니다)
      - name: 규칙 변경 점검
        id: check
        continue-on-error: true
        run: python tools/check_golfrules.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add coursedata/workfiles/golfrules_snapshot.json docs/골프룰_점검리포트.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "골프 규칙 월간 점검 $(date -u -d '+9 hours' +%Y-%m-%d) (github-actions)"
            git push
          fi

      # 점검이 실패(변경 감지 또는 접속 실패)했다면 여기서 워크플로를 실패로 끝냅니다.
      # 그래야 저장소 소유자에게 알림 메일이 갑니다.
      - name: 결과 반영
        if: steps.check.outcome != 'success'
        run: |
          echo "규칙 점검에서 확인할 것이 생겼습니다 — docs/골프룰_점검리포트.md 를 보세요."
          exit 1
